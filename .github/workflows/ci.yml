name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      mysql:
        # MySQL 5.7 com o charset padrão do servidor (sem opções),
        # para provar que a aplicação não depende da configuração do servidor.
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unyeducation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unyeducation_test
      DB_USERNAME: root
      DB_PASSWORD: root
      # Auditoria: a aplicação usa uma conta só com INSERT e SELECT (UNY-DOC-008, 9.3);
      # as migrações usam a conta com permissão de criar tabelas.
      AUDIT_DB_USERNAME: ava_audit_app
      AUDIT_DB_PASSWORD: audit
      AUDIT_MIGRATOR_USERNAME: root
      AUDIT_MIGRATOR_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, bcmath
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar banco de auditoria
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ava_audit_test;
            CREATE USER 'ava_audit_app'@'%' IDENTIFIED BY 'audit';
            GRANT INSERT, SELECT ON ava_audit_test.* TO 'ava_audit_app'@'%';"

      - name: Preparar aplicação
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: vendor/bin/phpunit --log-junit junit.xml

      - name: Resumo das falhas (anotações)
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              raiz = ET.parse('junit.xml').getroot()
          except Exception as e:
              print(f"::error::Sem junit.xml: {e}")
              raise SystemExit(0)
          n = 0
          for caso in raiz.iter('testcase'):
              for tipo in ('failure', 'error'):
                  for f in caso.findall(tipo):
                      if n >= 40:
                          break
                      txt = (f.text or f.get('message') or '').strip().replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:900]
                      print(f"::error title={caso.get('class') or caso.get('classname')}::{caso.get('name')} -> {txt}")
                      n += 1
          print(f"Total de falhas listadas: {n}")
          PY

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Auditoria de dependências
        run: composer audit
